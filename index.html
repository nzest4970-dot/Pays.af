<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pays d'Afrique</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:20px;
    background:#f4f4f4;
    transition: background 0.3s;
}

body.dark{
    background:#111;
    color:white;
}

h1{text-align:center;}

.topbar{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:15px;
    max-width:800px;
    margin-left:auto;
    margin-right:auto;
}

input, select{
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

input{
    flex:1;
    min-width:200px;
}

body.dark input, body.dark select{
    background:#222;
    color:white;
    border-color:#444;
}

button{
    padding:10px 15px;
    cursor:pointer;
    border:1px solid #ccc;
    border-radius:5px;
    background:#fff;
}

body.dark button{
    background:#222;
    color:white;
    border-color:#444;
}

ul{
    list-style:none;
    padding:0;
    max-width:800px;
    margin:auto;
}

li{
    background:white;
    margin:10px 0;
    border-radius:10px;
    cursor:pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

body.dark li{background:#222;}

a{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    text-decoration:none;
    color:inherit;
}

.flag{width:40px; border-radius:3px;}

#detailView{
    display:none;
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

body.dark #detailView{background:#222;}

#flagDetail{
    width:200px;
    display:block;
    margin:15px 0;
    border-radius:5px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<h1>Pays d'Afrique</h1>

<div class="topbar">
    <input id="search" placeholder="Rechercher un pays">
    <select id="filterRegion">
        <option value="Tous">Toutes les régions</option>
        <option value="Nord">Afrique du Nord</option>
        <option value="Ouest">Afrique de l'Ouest</option>
        <option value="Centrale">Afrique Centrale</option>
        <option value="Est">Afrique de l'Est</option>
        <option value="Australe">Afrique Australe</option>
    </select>
    <button onclick="toggleTheme()">Mode</button>
</div>

<div id="listView">
    <ul id="list"></ul>
</div>

<div id="detailView">
    <button onclick="back()">← Retour</button>
    <h2 id="name"></h2>
    <img id="flagDetail" alt="Drapeau détaillé">
    <p><b>Capitale:</b> <span id="cap"></span></p>
    <p><b>Population:</b> <span id="pop"></span></p>
    <p><b>Superficie:</b> <span id="area"></span></p>
    <p><b>Langue:</b> <span id="lang"></span></p>
    <p><b>Monnaie:</b> <span id="cur"></span></p>
    <p><b>Région:</b> <span id="reg"></span></p>
</div>

<script>
const countries = [

{n:"Djibouti",c:"dj",cap:"Djibouti",p:"1M",a:"23 200 km²",l:"Français/Arabe",m:"DJF",r:"Est"},
{n:"Égypte",c:"eg",cap:"Le Caire",p:"112M",a:"1 010 408 km²",l:"Arabe",m:"EGP",r:"Nord"},

{n:"Tchad",c:"td",cap:"N'Djamena",p:"17M",a:"1 284 000 km²",l:"Français/Arabe",m:"CFA",r:"Centrale"},
{n:"Togo",c:"tg",cap:"Lomé",p:"9M",a:"56 785 km²",l:"Français",m:"CFA",r:"Ouest"},
{n:"Tunisie",c:"tn",cap:"Tunis",p:"12M",a:"163 610 km²",l:"Arabe",m:"TND",r:"Nord"},
{n:"Zambie",c:"zm",cap:"Lusaka",p:"20M",a:"752 612 km²",l:"Anglais",m:"ZMW",r:"Australe"},
{n:"Zimbabwe",c:"zw",cap:"Harare",p:"16M",a:"390 757 km²",l:"Anglais",m:"ZWL",r:"Australe"}
];

// Tri alphabétique initial prenant en compte les caractères accentués
countries.sort((a, b) => a.n.localeCompare(b.n, 'fr'));

let data = [...countries];

function render(){
    const list = document.getElementById("list");
    
    const htmlContent = data.map(x => `
        <li onclick="openC('${x.n.replace(/'/g, "\\'")}')">
            <a>
                <img class="flag" src="https://flagcdn.com{x.c}.png" alt="Drapeau ${x.n}">
                ${x.n}
            </a>
        </li>
    `).join('');
    
    list.innerHTML = htmlContent;
}

function openC(n){
    let x = countries.find(e => e.n === n);
    if (!x) return;

    document.getElementById("listView").style.display = "none";
    document.getElementById("detailView").style.display = "block";

    document.getElementById("name").innerText = x.n;
    document.getElementById("flagDetail").src = `https://flagcdn.com{x.c}.png`;
    document.getElementById("cap").innerText = x.cap;
    document.getElementById("pop").innerText = x.p;
    document.getElementById("area").innerText = x.a;
    document.getElementById("lang").innerText = x.l;
    document.getElementById("cur").innerText = x.m;
    document.getElementById("reg").innerText = x.r;
}

function back(){
    document.getElementById("listView").style.display = "block";
    document.getElementById("detailView").style.display = "none";
}

function toggleTheme(){
    document.body.classList.toggle("dark");
}

function updateList() {
    const searchVal = document.getElementById("search").value.toLowerCase();
    const regionVal = document.getElementById("filterRegion").value;
    
    data = countries.filter(x => {
        const matchesSearch = x.n.toLowerCase().includes(searchVal);
        const matchesRegion = (regionVal === "Tous" || x.r === regionVal);
        return matchesSearch && matchesRegion;
    });
    
    render();
}

document.getElementById("search").addEventListener("input", updateList);
document.getElementById("filterRegion").addEventListener("change", updateList);

render();
</script>

</body>    
</html>
